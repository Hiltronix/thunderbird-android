name: Build Thunderbird 10.1 (Unsigned)

on:
  push:
    branches:
      - thunderbird-10.1-custom
    paths:
      - '.github/workflows/build-thunderbird-10.1.yml'
      - 'app-thunderbird/**'
      - 'app-common/**'
      - 'backend/**'
      - 'build-plugin/**'
      - 'core/**'
      - 'feature/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'legacy/**'
      - 'library/**'
      - 'mail/**'
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Thunderbird 10.1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Gradle
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Build unsigned release APK
        run: ./gradlew :app-thunderbird:assembleFossRelease --no-daemon

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thunderbird-10.1-UNSIGNED
          path: app-thunderbird/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 7
